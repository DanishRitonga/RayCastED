# PanNuke training config — RT-DETR RayCast variant
# Uses RT-DETR's transformer decoder with deformable attention instead of FCN head.
# This is a sanity check: if RT-DETR + RayCast outperforms the FCN version,
# it confirms that decoder-level query competition solves the overprediction
# bottleneck that plagues the FCN approach.

global_settings:
  root_dir: "/home/danishrtg/projects/RayCastED/raycasted/data/dataset"
  variant: "s"        # YOLO26 variant: n, s, m, l, x
  model: "raycasted/cfg/yolo26s-rtdetr-p234.yaml"
  n_rays: 64
  max_size: 256
  crop_size: 256
  output_mpp: 0.25
  patching_overlap_pct: 0
  annotation_type: "raycast"

  global_cell_map:
    "Neoplastic": 0
    "Inflammatory": 1
    "Connective": 2
    "Dead": 3
    "Epithelial": 4

  global_tissue_map:
    "Adrenal Gland": 0
    "Bile Duct": 1
    "Bladder": 2
    "Breast": 3
    "Cervix": 4
    "Colorectal": 5
    "Esophagus": 6
    "Head & Neck": 7
    "Kidney": 8
    "Liver": 9
    "Lung": 10
    "Ovarian": 11
    "Pancreatic": 12
    "Prostate": 13
    "Skin": 14
    "Stomach": 15
    "Testis": 16
    "Thyroid": 17
    "Uterus": 18

# Training settings for RT-DETR RayCast transformer decoder
training:
  patience: 100

  # AdamW optimizer (required for transformer decoder — SGD fails to learn)
  optimizer: AdamW
  lr0: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 10

  # Pretrained FCN backbone+neck weights (train102, bPQ=0.370, mAP50=0.533)
  # Loads layers 0-20 from FCN checkpoint, random-initializes only the decoder head.
  pretrained_ckpt: "/mnt/data/projects/RayCastED/output/bipartite/train102/weights/best.pt"

  # No pretrained backbone (YOLO26s trained from scratch)
  pretrained: false

  # Freeze pretrained backbone for 30 epochs so the decoder can converge
  # to stable features before the backbone co-adapts. Same as LSP-DETR.
  backbone_freeze_epochs: 30
  backbone_lr_ratio: 0.1

  # Cosine LR schedule for AdamW
  cos_lr: true

  # Gradient clipping (prevents decoder + polar IoU gradient explosion)
  clip_grad: 0.1

  # Augmentation (polygon-safe)
  stain_jitter: true
  stain_hsv_h: 0.05
  stain_hsv_s: 0.3
  stain_hsv_v: 0.2
  stain_blur_prob: 0.2
  stain_blur_sigma: 1.0

  scale_augment: true
  scale_range: [0.7, 1.3]

  translate_augment: true
  translate_range: 0.1

  inference_conf: 0.20

datasets:
  PanNuke:
    root_dir: "PanNuke/data"
    ingestor: parquet
    native_mpp: 0.25

    split_separation: "filename_regex"
    split_args:
      regex: "(fold[1-3])"
      split_map:
        "fold1": "train"
        "fold2": "val"
        "fold3": "test"
    modality_separation: "bundled_archive"

    namespace_map:
      '0': "Neoplastic"
      '1': "Inflammatory"
      '2': "Connective"
      '3': "Dead"
      '4': "Epithelial"
    tissue_map:
      '0': "Adrenal Gland"
      '1': "Bile Duct"
      '2': "Bladder"
      '3': "Breast"
      '4': "Cervix"
      '5': "Colorectal"
      '6': "Esophagus"
      '7': "Head & Neck"
      '8': "Kidney"
      '9': "Liver"
      '10': "Lung"
      '11': "Ovarian"
      '12': "Pancreatic"
      '13': "Prostate"
      '14': "Skin"
      '15': "Stomach"
      '16': "Testis"
      '17': "Thyroid"
      '18': "Uterus"
