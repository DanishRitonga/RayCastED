global_settings:
  root_dir: "/mnt/data/projects/RayCastED/raycasted/data/dataset"
  variant: "s"        # YOLO26 variant: n, s, m, l, x
  model: "raycasted/cfg/yolo26s-run28-p234.yaml"
  n_rays: 64
  max_size: 256
  crop_size: 256
  output_mpp: 0.25
  patching_overlap_pct: 0
  annotation_type: "raycast"

  global_cell_map:
    "Neoplastic": 0
    "Inflammatory": 1
    "Connective": 2
    "Dead": 3
    "Epithelial": 4

  global_tissue_map:
    "Adrenal Gland": 0
    "Bile Duct": 1
    "Bladder": 2
    "Breast": 3
    "Cervix": 4
    "Colorectal": 5
    "Esophagus": 6
    "Head & Neck": 7
    "Kidney": 8
    "Liver": 9
    "Lung": 10
    "Ovarian": 11
    "Pancreatic": 12
    "Prostate": 13
    "Skin": 14
    "Stomach": 15
    "Testis": 16
    "Thyroid": 17
    "Uterus": 18

# Training settings — recommended values for improved detection quality.
training:
  # Architecture selector: 'yolo26' (v1 FCN), 'nulite' (FastViT + NuLite decoder + NP seg head + FCN heads),
  # or 'nulite_detr' (same backbone, single query-based DETR head with seed-map query selection)
  architecture: nulite_detr

  # NuLite-specific
  nulite_variant: fastvit_t12   # SEG-stream variant (frozen oracle; must match nulite_ckpt)
  nulite_ckpt: output/oracle/nuLiteT-fold1-sep-t12.pt  # frozen fold1-only FG/BG oracle (separable decoder)
  det_variant: fastvit_t12      # DETECTION-stream encoder variant (trainable)
  pretrained: true              # ImageNet-pretrained encoder via timm (V1/V2); false = full scratch
  lambda_seg: 1.0               # seed-map seg loss weight (INERT in two_stream — seg stream frozen, lambda_seg zeroed in code)
  seed_map_target: true         # InstanSeg-style center-weighted distance-to-boundary target (vs hard binary NP mask)
  gate_scale: 0.0               # SAM-conditioner gate bound (FCN-only; unused by nulite_detr)
  freeze_encoder_decoder: false # phase-2a: freeze encoder+decoder+NP, train head only

  # Staged backbone fine-tune (LSP-DETR: freeze ImageNet encoder to epoch 30, then 10% LR)
  backbone_freeze_epochs: 0     # two_stream: 0 — det stream (t12) trains end-to-end; seg stream is frozen in code (not via this knob)
  backbone_lr_scale: 0.1        # encoder LR multiplier after unfreeze (rest of the model trains at base LR)

  # Curriculum stage-2 decoder warm-up (INERT in two_stream — det stream decoder trains from ep0)
  decoder_freeze_epochs: 0      # freeze NuLite decoder for this many initial epochs (0 = decoder trains from ep0)
  decoder_lr_scale: 0.1         # decoder LR multiplier after the decoder freeze window

  # NuLite DETR head
  detr_nq: 300                  # number of queries (dense tiles reach ~200 nuclei)
  detr_ndl: 6                   # decoder layers (capacity run: 3→6, unshared; LSP-DETR uses 6)
  detr_hd: 256                  # decoder hidden dim (capacity run: 128→256; LSP-DETR decoder d=384)
  detr_d_ffn: 1024              # decoder FFN hidden dim (4x hd; LSP-DETR SwiGLU hidden 1024)
  detr_seed_threshold: 0.5      # seed-map local-maxima min value for query seeding
  detr_peak_distance: 3         # seed-map local-maxima neighbourhood (px)
  detr_grid_size: 0.05          # grid cell diameter for grid-query init (normalized). C2: back to 0.05 (400q) — dense 0.033 (900q, train9) was a WASH/fired fewer
  detr_query_selection: grid    # fixed grid initialization for the recast experiment
  detr_query_warmup_epochs: 0   # fixed query initialization throughout training
  detr_seed_feature: false     # hybrid A/B base = train23 (seed-as-4th-level; fewer moving parts than F-channel concat)
  detr_hybrid_peaks: 100       # hybrid: extra seed-peak queries appended to the 400 grid queries (fallback = duplicate grid centers)
  detr_no_object: true          # explicit "no object" class via focal loss (LSP-DETR style)
  detr_seed_in_content: true    # concat raw seed logit to score-head inputs (ladder base = train19 S+F+Q)
  detr_no_object_weight: 2.0    # ∅ focal column weight (train18 base: 2.0; train20 1.0 was a fold3 regression)
  detr_cls_weight: 2.0          # DETR cls loss gain. train4 was 1.0 -> cls only fell 1.8x over 600ep vs 8.8x legacy (starved); restored 2.0
  detr_piou_weight: 3.0         # DETR polar-IoU loss gain (locked-recipe 3.0; LSP-exact dropped it)
  detr_xy_weight: 500.0         # centroid loss gain. Huber-calibrated (delta .05); train4 L1@500 hogged ~60% of budget -> xy back to Huber. sweep lower to test magnitude
  detr_lsp: false               # LSP-DETR-exact loss/matching + query init. train6: FALSE = locked recipe (0.6202 champion) + lambda_seg 3.0; LSP-exact runs (train4/5) trailed locked by 1.7-2.6pt
  detr_matcher_lsp: true        # ISOLATED test: LSP matcher only (class1/pointL1/radial-from-centroid/9999 inside gate); loss gains + query init stay locked
  detr_query_block_size: 0      # LSP grid cell diameter in PIXELS (~3.5um @ 0.25mpp; ceil(256/14)=19 -> 361 queries); 0 = legacy normalized grid_size
  detr_content_top: false       # sample query content from the top-level (stride-32) stage feature (LSP FeatureSampling on stage-4 neck)
  detr_seed_resize: bilinear    # F-channel seed downsample: bilinear (locked) | max (regressed train16) | topk | avg
  detr_layer_schedule: ""       # option-1 (b5-off) was a wash vs train18 → reverted
  detr_seed_level: true         # hybrid A/B base = train23: seed map is a 4th projected cross-attn level
  detr_seed_level_stride: 4     # stride of the seed-level projection (4 = b3 resolution; preserves small-nucleus signal, ~4MB/img)
  detr_recast: true             # local embedding correction; same queries and decoder passes
  detr_recast_after_layer: 3    # correct after layer 3, refine through layers 4-6
  detr_recast_radius_px: 4.0    # 3x3 sampling stencil in a +/-4px neighbourhood
  detr_polygon_masked_attention: false # isolated appearance experiment: prior masked-attention path disabled
  detr_polygon_oracle_mask: false # isolated appearance experiment: oracle polygon mask disabled
  detr_polygon_mask_floor: 0.1  # recovery path for evidence outside an immature polygon
  detr_polygon_mask_temperature: 0.1 # soft decay beyond the predicted radial boundary
  detr_respawn: false            # recall-repair: 2nd decoder pass re-anchoring emptiest queries on uncovered seed peaks
  detr_respawn_peaks: 64        # max respawned queries per image
  detr_respawn_min_seed: 0.5    # min seed value for a candidate respawn peak
  detr_aux_dense_weight: 0.0    # dense auxiliary experiment disabled after train34 (no held-out gain)
  detr_aux_dense_type_weight: 1.0 # five-type CE relative to dense nucleus/background BCE
  detr_appearance_weight: 0.25 # Train30 appearance baseline for the isolated instance-alignment ablation
  detr_appearance_channels: 32 # compact high-resolution b1+b3 appearance representation
  detr_presence_weight: 0.0 # presence ablation (train31) was a held-out wash
  detr_presence_negative_margin_px: 4.0 # required clearance for an unambiguous negative query
  detr_appearance_imitation_weight: 0.0 # outside the three-run supervised appearance protocol
  detr_appearance_imitation_temperature: 0.1 # cosine-softmax temperature
  detr_appearance_imitation_small_area: 200.0 # pixel-area cutoff for small owner students
  detr_instance_alignment_weight: 0.025 # calibrated to stay below the baseline shared-feature gradient
  detr_instance_alignment_temperature: 0.1 # cosine-softmax temperature for local identity discrimination
  detr_instance_alignment_radius_px: 30.0 # only nearby GT instances become hard negatives
  detr_instance_alignment_max_negatives: 8 # cap local negatives per owner
  detr_seg_fg_margin_weight: 0.5 # matched positives with local seg evidence must beat the empty logit
  detr_seg_fg_margin: 1.0       # required true-class minus empty-logit margin
  detr_seg_fg_radius_px: 4.0    # 3x3 evidence stencil, aligned with query recasting
  detr_seg_fg_margin_layer_weights: [] # Train36 final-layer-only margin supervision
  detr_mds: false               # MDS-DETR rank-causal self-attn mask (ablation: false = plain self-attn, train18 ref was true)
  detr_cost_inside: 10.0        # LSP-DETR inner-mask cost Wm: near-hard gate under detr_lsp (legacy 10.0)
  detr_per_layer_match: true    # LSP-DETR 'look forward twice': per-layer Hungarian matching in aux loss (vs reuse last-layer match)
  detr_duplicate_train_topk: 1  # strict Train36 one-to-one ownership; duplicate experiment disabled
  detr_duplicate_nms_iou: 0.5   # class-agnostic polygon NMS for duplicate-aware validation/inference eval
  detr_use_decoder: true        # true = NuLite decoder+NP head on (train24 no-decoder bPQ 0.636 < 0.657 → decoder NEEDED; back on for train25)
  detr_shared_layers: false     # capacity run: 3 shared → 6 distinct transformer layers (LSP-DETR parity)
  detr_separable_decoder: true  # locked recipe: separable NuLite decoder (two_stream: false, det stream standard; seg stream separable by construction)
  detr_backbone: two_stream     # train26 proof: frozen oracle seg stream (2 enc + 2 dec) + trainable t12 det stream
  detr_use_seed: true           # add stride-4 NP seed head on P2 (yolo11 backbone only)
  yolo11_scale: s               # yolo11 variant scale (n/s/m/l/x) for detr_backbone=yolo11
  yolo11_ckpt: null             # path to yolo11*.pt for layers 0-16 (null = auto 'yolo11<scale>.pt' when pretrained=true)
  fitness_warmup_epochs: 75     # mask fitness before this epoch (guards best-tracking vs early fluke spikes)

  # Mixed precision: DETR (transformer) training overflows fp16 (scaler → 0.0,
  # all-NaN ~epoch 87). false = train DETR in fp32.
  amp: false

  # Head architecture
  head_channel_scale: 0.5    # c2 = max(head_channel_min, ch * scale). Was 0.25
  head_channel_min: 64       # minimum channels in polygon head. Was 16
  cls_channel_scale: 1.0     # c3 = max(cls_channel_min, ch[0] * scale). 1.0 = original (dead end at 2.0, train33)
  cls_channel_min: 0         # minimum cls head intermediate channels. 0 = use ch[0]

  # LSP-DETR ray initialization: start at minimum plausible nucleus radius
  # so gradient is unidirectional (expand only), avoiding conflicting shrink/expand signals
  native_mpp: 0.25             # microns per pixel (PanNuke 40x = 0.25 um/px)
  min_nucleus_diameter_um: 3.5 # minimum nucleus diameter (PMC 4600468), radius = 1.75um → 7px

  # Early stopping
  patience: 300

  # Learning rate
  cos_lr: true               # cosine LR schedule
  warm_restarts: false       # plain cosine (SGDR restarts destabilize the DETR conf balance)
  warm_restarts_T0: 133      # first cycle length (3 cycles in 400: 133→266→399)
  warm_restarts_T_mult: 1    # period multiplier (1=equal cycles, 2=doubling)
  warm_restarts_eta_min: 0.0001  # minimum LR at cycle bottom

  # E2E dual-TAL assignment (NMS-free, like YOLO26)
  tal_topk: 15                 # one2many positives per GT
  assigner_radius_scale: 1.0   # containment radius multiplier (1.0 = 75th-pctile GT radius)
  assigner_alpha: 0.5          # cls score exponent in align = cls^α × piou^β
  assigner_beta: 2.0           # Polar-IoU exponent
  align_threshold: 0.0         # minimum overlap proxy for positive assignment (0=disabled)
  o2o_topk2_start: 3           # o2o branch initial positives per GT (annealed to 1)
  o2o_topk2_anneal_epoch: 67   # epoch to start annealing topk2 from 3→1
  o2o_topk2_anneal_end: 0.5    # topk2 reaches 1 at 50% of training

  focal_gamma: 2.0             # Focal loss gamma (0=BCE, >0=focal)
  focal_alpha: 0.75            # fg weight (bg weight = 1-alpha = 0.25)
  log_ray_loss: true           # Log-space L1 on rays — equalizes relative errors across scales
  bg_fg_ratio: 3               # Max bg anchors per fg anchor in cls loss (o2m branch)

  # Per-o2o cls loss overrides — o2o branch must be a "background specialist"
  # for NMS-free inference.
  focal_gamma_o2o: 2.0         # Focal loss — suppresses easy bg, keeps hard negatives
  focal_alpha_o2o: 0.75        # Fg weight
  bg_fg_ratio_o2o: 0           # No bg subsampling for o2o

  # Auxiliary XY head: bypasses 4-layer head stack to give backbone direct xy gradient
  aux_xy_weight: 10.0           # Huber loss weight for aux xy predictions
  aux_xy_ramp_epochs: 100       # epoch at which aux xy weight begins linear decay to zero

  # Knowledge distillation: o2m cls heads → o2o cls heads.
  # BCE loss between detached o2m sigmoid probs and o2o logits on ALL anchors.
  o2o_distill_weight: 0.5

  # Inter-scale competition: softmax across scales to suppress cross-scale duplicates.
  inter_scale_competition: true
  inter_scale_temperature: 0.5       # softmax temperature (lower = sharper)

  # Pixel-Level Balancing: area-based fg weighting to boost small nuclei
  plb_enabled: true

  # Loss weights
  lambda_cls: 2.0
  lambda_xy: 500.0              # high: compensates sigmoid→stride→imgsz attenuation
  lambda_l1: 14.0
  lambda_piou: 3.0              # minimal: let analytical L1 dominate shape

  # Sigma annealing: sigma_anneal_start=0 falls back to assigner_radius_scale.
  sigma_anneal_start: 0
  sigma_anneal_end: 0.5
  sigma_anneal_epoch: 200

  # STAL (force minimum positives per GT).
  stal_min_positives: 3

  # Weighted class/tissue sampling
  weighted_sampling: false      # balance 5 cell classes AND 19 tissues (LSP-DETR parity; targets macro mPQ)
  sampler_gamma: 0.85

  # Augmentation (polygon-safe)
  stain_jitter: true
  stain_hsv_h: 0.05
  stain_hsv_s: 0.3
  stain_hsv_v: 0.2
  stain_blur_prob: 0.2
  stain_blur_sigma: 1.0

  scale_augment: true
  scale_range: [0.7, 1.3]

  translate_augment: true
  translate_range: 0.1

  # Extra LSP-DETR-style augs (photometric + zoom-in crop)
  aug_noise_prob: 0.0           # additive Gaussian noise probability
  aug_noise_std: 0.1            # noise std in [0,1] image units
  aug_randcrop_prob: 0.0        # random sub-window resized back to crop_size (zoom-in)
  aug_randcrop_min: 128
  aug_randcrop_max: 256

  inference_conf: 0.20

  # Pretrained backbone (COCO weights, layers 0-10 only)
  pretrained_backbone: null  # disabled for scratch training

  # DCNv2 (modulated deformable conv) in head
  dcn_in_reg_head: false
  dcn_in_cls_head: false

  # Hierarchical cls: split o2o cls into binary (fg/bg, 1ch) + class (cell type, nc ch).
  hierarchical_cls: true
  hierarchical_cls_detach: true
  hierarchical_binary_threshold: 0.01

  # CLS-only TAL: o2o assigner uses cls^alpha * gaussian_decay (no pIoU)
  cls_only_tal: true

  # Gradient clipping
  clip_grad: 10.0

datasets:
  PanNuke:
    root_dir: "PanNuke/data"
    ingestor: parquet
    native_mpp: 0.25

    split_separation: "filename_regex"
    split_args:
      regex: "(fold[1-3])"
      split_map:
        "fold1": "train"
        "fold2": "val"
        "fold3": "test"
    modality_separation: "bundled_archive"

    namespace_map:
      '0': "Neoplastic"
      '1': "Inflammatory"
      '2': "Connective"
      '3': "Dead"
      '4': "Epithelial"
    tissue_map:
      '0': "Adrenal Gland"
      '1': "Bile Duct"
      '2': "Bladder"
      '3': "Breast"
      '4': "Cervix"
      '5': "Colorectal"
      '6': "Esophagus"
      '7': "Head & Neck"
      '8': "Kidney"
      '9': "Liver"
      '10': "Lung"
      '11': "Ovarian"
      '12': "Pancreatic"
      '13': "Prostate"
      '14': "Skin"
      '15': "Stomach"
      '16': "Testis"
      '17': "Thyroid"
      '18': "Uterus"
