global_settings:
  root_dir: "/home/danishrtg/projects/RayCastED/raycasted/data/dataset"
  variant: "s"        # YOLO26 variant: n, s, m, l, x
  model: "raycasted/cfg/yolo26s-run25-hybrid-wavelet-backbone.yaml"  
  n_rays: 64          # Number of radial rays for polygon parameterization
  max_size: 256
  crop_size: 256
  output_mpp: 0.25
  patching_overlap_pct: 0
  annotation_type: "raycast"

  global_cell_map:
    "Neoplastic": 0
    "Inflammatory": 1
    "Connective": 2
    "Dead": 3
    "Epithelial": 4

  global_tissue_map:
    "Adrenal Gland": 0
    "Bile Duct": 1
    "Bladder": 2
    "Breast": 3
    "Cervix": 4
    "Colorectal": 5
    "Esophagus": 6
    "Head & Neck": 7
    "Kidney": 8
    "Liver": 9
    "Lung": 10
    "Ovarian": 11
    "Pancreatic": 12
    "Prostate": 13
    "Skin": 14
    "Stomach": 15
    "Testis": 16
    "Thyroid": 17
    "Uterus": 18

# Training settings — recommended values for improved detection quality.
# Omit the entire section for legacy behavior (backward compat).
training:
  # Head architecture
  head_channel_scale: 0.5    # c2 = max(head_channel_min, ch * scale). Was 0.25
  head_channel_min: 64       # minimum channels in polygon head. Was 16

  # Early stopping
  patience: 300              # epochs with no improvement before stopping (default: 100)

  # Learning rate
  cos_lr: true               # cosine LR schedule. Was false

  # E2E dual-assignment (NMS-free)
  tal_topk: 20                # one2many positives per GT (increased for dense cell scenes)
  assigner_radius_scale: 1.5  # containment radius multiplier
  assigner_alpha: 0.5         # cls^alpha in alignment metric
  assigner_beta: 3.0          # iou^beta in alignment metric (one2many only)
  use_hungarian_o2o: true     # Hungarian matching for one2one branch (globally optimal)

  # L1-based Hungarian assignment cost (one2one branch)
  cost_class: 1.0             # focal classification cost weight
  cost_centroid: 1.0          # L1 centroid cost weight
  cost_ray: 1.0               # relative-L1 ray cost weight (scale-invariant)

  # Classification loss
  focal_gamma: 1.0           # Focal loss gamma (0 = BCE, 1.0 = recommended start)
  focal_alpha: 1.0           # Focal loss alpha (1.0 = no class weighting)

  # Augmentation (polygon-safe)
  stain_jitter: true         # HSV color jitter for histopathology. Was false
  stain_hsv_h: 0.05          # hue shift range
  stain_hsv_s: 0.3           # saturation scale range (±)
  stain_hsv_v: 0.2           # value/brightness scale range (±)
  stain_blur_prob: 0.2       # probability of Gaussian blur
  stain_blur_sigma: 1.0      # max blur sigma

  scale_augment: true        # random scale augmentation. Was false
  scale_range: [0.7, 1.3]    # min/max scale factors

  translate_augment: true    # random translation augmentation. Was false
  translate_range: 0.1       # fraction of crop_size

  # Soft polar centerness → IoU-aware quality prediction
  soft_polar_centerness: true  # Trained to predict Polar-IoU (not centered-ness)
  centerness_weight: 1.0       # BCE loss weight for IoU quality prediction
  inference_conf: 0.20         # Optimal threshold with IoU-aware scoring (was 0.25)

  refinement_kernel_size: 3    # Kernel size for polygon refinement block
                               # 3 = standard RayRefinementBlock (Run 11 baseline)
                               # 7 = LargeKernelRefinementBlock — tested in Run 12, negligible impact
                               # Conclusion: bottleneck is in neck, not head

  # Pretrained backbone (COCO weights, layers 0-10 only)
  pretrained_backbone: null  # DISABLED for scratch training experiment

datasets:
  PanNuke:
    root_dir: "PanNuke/data"
    ingestion_method: 1
    native_mpp: 0.25

    split_separation: "filename_regex"
    split_args:
      regex: "(fold[1-3])"
      split_map:
        "fold1": "train"
        "fold2": "val"
        "fold3": "test"
    modality_separation: "bundled_archive"

    namespace_map:
      '0': "Neoplastic"
      '1': "Inflammatory"
      '2': "Connective"
      '3': "Dead"
      '4': "Epithelial"
    tissue_map:
      '0': "Adrenal Gland"
      '1': "Bile Duct"
      '2': "Bladder"
      '3': "Breast"
      '4': "Cervix"
      '5': "Colorectal"
      '6': "Esophagus"
      '7': "Head & Neck"
      '8': "Kidney"
      '9': "Liver"
      '10': "Lung"
      '11': "Ovarian"
      '12': "Pancreatic"
      '13': "Prostate"
      '14': "Skin"
      '15': "Stomach"
      '16': "Testis"
      '17': "Thyroid"
      '18': "Uterus"
