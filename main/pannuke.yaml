global_settings:
  root_dir: "/home/danishrtg/projects/RayCastED/raycasted/data/dataset"
  variant: "s"        # YOLO26 variant: n, s, m, l, x
  model: "raycasted/cfg/yolo26s-run28-p234.yaml"  
  n_rays: 64
  max_size: 256
  crop_size: 256
  output_mpp: 0.25
  patching_overlap_pct: 0
  annotation_type: "raycast"

  global_cell_map:
    "Neoplastic": 0
    "Inflammatory": 1
    "Connective": 2
    "Dead": 3
    "Epithelial": 4

  global_tissue_map:
    "Adrenal Gland": 0
    "Bile Duct": 1
    "Bladder": 2
    "Breast": 3
    "Cervix": 4
    "Colorectal": 5
    "Esophagus": 6
    "Head & Neck": 7
    "Kidney": 8
    "Liver": 9
    "Lung": 10
    "Ovarian": 11
    "Pancreatic": 12
    "Prostate": 13
    "Skin": 14
    "Stomach": 15
    "Testis": 16
    "Thyroid": 17
    "Uterus": 18

# Training settings — recommended values for improved detection quality.
training:
  # Head architecture
  head_channel_scale: 0.5    # c2 = max(head_channel_min, ch * scale). Was 0.25
  head_channel_min: 64       # minimum channels in polygon head. Was 16

  # Early stopping
  patience: 300              # epochs with no improvement before stopping (default: 100)

  # Learning rate
  cos_lr: true               # cosine LR schedule. Was false

  # E2E dual-assignment (NMS-free)
  tal_topk: 10                 # one2many positives per GT (reduced from 20 to fix positive-rate flooding)
  assigner_radius_scale: 1.5  # containment radius multiplier
  assigner_alpha: 0.5         # cls score exponent in align = cls^α × piou^β
  assigner_beta: 6.0          # Polar-IoU exponent — high β creates geometric dominance for dense cells
  align_threshold: 0.0        # minimum overlap proxy for positive assignment (0=disabled)
  use_hungarian_o2o: true     # Hungarian matching for one2one branch (globally optimal)

  # Unified assignment cost (both one2many and one2one branches)
  cost_class: 1.0             # focal classification cost weight
  cost_centroid: 1.0          # L2 centroid distance cost weight
  cost_ray: 1.0               # log-space L1 ray cost weight

  # Assignment warmup: use centroid-distance matching for early epochs
  assigner_warmup_epochs: 50  # epochs of centroid-distance before switching to Polar-IoU
  steps_per_epoch: 133        # batches per epoch (for warmup scheduling)

  # Auxiliary XY head: bypasses 4-layer head stack to give backbone direct xy gradient
  # Addresses H7 (backbone feature poverty) — backbone can't learn spatial features
  # because the head attenuates xy gradients through 4 Conv layers.
  aux_xy_weight: 10.0           # Huber loss weight for aux xy predictions
  aux_xy_ramp_epochs: 100       # epoch at which aux xy weight begins linear decay to zero

  # Classification loss — focal loss for one2one (extreme fg/bg imbalance)
  focal_gamma: 2.0            # Focal loss gamma (DETR-style for Hungarian matching)
  focal_alpha: 0.5           # Focal loss alpha — 0.25 = standard (positive samples get 0.25 weight)
                               # Background samples get (1-alpha)=0.75 weight (they dominate numerically)
  log_ray_loss: true           # Log-space L1 on rays — equalizes relative errors across scales

  # GradNorm — disabled; loss-ratio method downweights stuck tasks (xy)
  gradnorm: false

  # Weighted class/tissue sampling
  weighted_sampling: false     # Enable class+ tissue balanced sampling (off by default)
  sampler_gamma: 0.85          # Re-weighting strength (0=uniform, 1=full inverse-frequency)

  # Augmentation (polygon-safe)
  stain_jitter: true         # HSV color jitter for histopathology. Was false
  stain_hsv_h: 0.05          # hue shift range
  stain_hsv_s: 0.3           # saturation scale range (±)
  stain_hsv_v: 0.2           # value/brightness scale range (±)
  stain_blur_prob: 0.2       # probability of Gaussian blur
  stain_blur_sigma: 1.0      # max blur sigma

  scale_augment: true        # random scale augmentation. Was false
  scale_range: [0.7, 1.3]    # min/max scale factors

  translate_augment: true    # random translation augmentation. Was false
  translate_range: 0.1       # fraction of crop_size

  inference_conf: 0.20         # Confidence threshold for inference (was 0.25)

  refinement_kernel_size: 3    # Kernel size for polygon refinement block
                               # 3 = standard RayRefinementBlock (Run 11 baseline)
                               # 7 = LargeKernelRefinementBlock — tested in Run 12, negligible impact
                               # Conclusion: bottleneck is in neck, not head

  # Pretrained backbone (COCO weights, layers 0-10 only)
  pretrained_backbone: null  # DISABLED for scratch training experiment

datasets:
  PanNuke:
    root_dir: "PanNuke/data"
    ingestor: parquet
    native_mpp: 0.25

    split_separation: "filename_regex"
    split_args:
      regex: "(fold[1-3])"
      split_map:
        "fold1": "train"
        "fold2": "val"
        "fold3": "test"
    modality_separation: "bundled_archive"

    namespace_map:
      '0': "Neoplastic"
      '1': "Inflammatory"
      '2': "Connective"
      '3': "Dead"
      '4': "Epithelial"
    tissue_map:
      '0': "Adrenal Gland"
      '1': "Bile Duct"
      '2': "Bladder"
      '3': "Breast"
      '4': "Cervix"
      '5': "Colorectal"
      '6': "Esophagus"
      '7': "Head & Neck"
      '8': "Kidney"
      '9': "Liver"
      '10': "Lung"
      '11': "Ovarian"
      '12': "Pancreatic"
      '13': "Prostate"
      '14': "Skin"
      '15': "Stomach"
      '16': "Testis"
      '17': "Thyroid"
      '18': "Uterus"
