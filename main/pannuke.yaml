global_settings:
  root_dir: "/home/danishrtg/projects/RayCastED/raycasted/data/dataset"
  variant: "s"        # YOLO26 variant: n, s, m, l, x
  model: "raycasted/cfg/yolo26s-run28-p234.yaml"  
  n_rays: 64
  max_size: 256
  crop_size: 256
  output_mpp: 0.25
  patching_overlap_pct: 0
  annotation_type: "raycast"

  global_cell_map:
    "Neoplastic": 0
    "Inflammatory": 1
    "Connective": 2
    "Dead": 3
    "Epithelial": 4

  global_tissue_map:
    "Adrenal Gland": 0
    "Bile Duct": 1
    "Bladder": 2
    "Breast": 3
    "Cervix": 4
    "Colorectal": 5
    "Esophagus": 6
    "Head & Neck": 7
    "Kidney": 8
    "Liver": 9
    "Lung": 10
    "Ovarian": 11
    "Pancreatic": 12
    "Prostate": 13
    "Skin": 14
    "Stomach": 15
    "Testis": 16
    "Thyroid": 17
    "Uterus": 18

# Training settings — recommended values for improved detection quality.
training:
  # Head architecture
  head_channel_scale: 0.5    # c2 = max(head_channel_min, ch * scale). Was 0.25
  head_channel_min: 64       # minimum channels in polygon head. Was 16

  # Early stopping
  patience: 100              # epochs with no improvement before stopping (default: 100)

  # Learning rate
  cos_lr: true               # cosine LR schedule. Was false

  # E2E dual-TAL assignment (NMS-free, like YOLO26)
  tal_topk: 15                 # one2many positives per GT — dynamic topk masks garbage candidates
  assigner_radius_scale: 1.0  # containment radius multiplier (1.0 = 75th-pctile GT radius)
  assigner_alpha: 0.5         # cls score exponent in align = cls^α × piou^β
  assigner_beta: 6.0          # Polar-IoU exponent — high β creates geometric dominance for dense cells
  align_threshold: 0.0        # minimum overlap proxy for positive assignment (0=disabled)
  o2o_topk2_start: 3           # o2o branch initial positives per GT (annealed to 1)
  o2o_topk2_anneal_epoch: 120  # epoch to start annealing topk2 from o2o_topk2_start→1

  # 2-phase Hungarian curriculum: TAL-only → Hungarian ramp
  # Phase 1 (0→100): standard dual-TAL, o2m > o2o
  # Phase 2 (100+): Hungarian o2o ramps 0→0.9 over remaining training
  hungarian_phase2_start: -1         # -1 = auto (start when o2o>o2m, ~57% of max_epochs)
  hungarian_max_weight: 0.9
  hungarian_ramp_epochs: 0        # 0 = auto (ramp over remaining epochs)
  phase2_freeze_epochs: 0         # backbone freeze at phase2 start (0=disabled)
  hungarian_cost_class: 1.0
  hungarian_cost_centroid: 1.0
  hungarian_cost_ray: 1.0

  # Auxiliary XY head: bypasses 4-layer head stack to give backbone direct xy gradient
  # because the head attenuates xy gradients through 4 Conv layers.
  aux_xy_weight: 10.0           # Huber loss weight for aux xy predictions
  aux_xy_ramp_epochs: 100       # epoch at which aux xy weight begins linear decay to zero

  # Classification loss — base settings for both o2m and o2o branches
  # (o2o branch is overridden by the per-branch section below)
  focal_gamma: 2.0            # Focal loss gamma (0=BCE, >0=focal). Both branches.
  focal_alpha: 0.75           # fg weight (bg weight = 1-alpha = 0.25). Applies to o2m branch.
                               # o2o uses focal_alpha_o2o=0.25 instead (standard RetinaNet setting).
                               # 0.5 caused mode collapse. Previous best: mAP50=0.411 with alpha=0.75
  log_ray_loss: true           # Log-space L1 on rays — equalizes relative errors across scales
  bg_fg_ratio: 3               # Max bg anchors per fg anchor in cls loss (o2m branch)
                                # o2o uses bg_fg_ratio_o2o=0 (no subsampling, focal handles imbalance)

  # Soft targets — use assigner's quality-weighted alignment scores instead of
  # hard 0/1 binarisation. TESTED: harmful in E2E dual-assigner setup. Quality
  # scores prevent convergence — cls_loss plateaus at ~0.17 vs ~0.02 with hard
  # targets. mAP50(P) dropped 4 points. Keep disabled.
  soft_targets: false

  # Per-o2o soft targets: use alignment quality as cls target for the o2o branch only.
  # Train25: broken normalization (cls_targets.sum() vs fg_mask.sum()). Train26: fixed norm
  # but standard FL formula is wrong for continuous targets — gives MAXIMUM loss when σ=y.
  # Train27: uses QFL (Quality Focal Loss, GFL NeurIPS 2020) — correct formula |y-σ|^β.
  soft_targets_o2o: false

  # Per-o2o cls loss overrides — the o2o branch must be a "background specialist"
  # for NMS-free inference. These override the base values above for o2o only.
  focal_gamma_o2o: 2.0        # Focal loss — suppresses easy bg, keeps hard negatives
  focal_alpha_o2o: 0.75       # Fg weight — match o2m (train13 proved 0.75 works)
  bg_fg_ratio_o2o: 0          # No bg subsampling — focal loss handles imbalance, 98.7% exclusion was starving cls head
  bg_cls_decay_o2o: 1.0       # Full bg weight — don't starve bg suppression (0.5 over-corrected)
  fg_cls_boost_o2o: null       # Additive boost disabled for o2o
  fg_cls_quality_scale_o2o: null  # Multiplicative disabled — was starving fg (TAL quality 0.2-0.5)

  # DINO-style contrastive denoising (o2o branch only)
  # Injects corrupted GT copies before TAL assignment, providing more fg
  # training signal. With QFL soft targets, corrupted copies get lower
  # quality → model learns confidence discrimination.
  dn_num: 2                      # corrupted copies per GT for DINO contrastive denoising
  dn_centroid_noise: 0.05        # max centroid shift in normalised coords (~13px at 256)
  dn_ray_noise: 0.1              # multiplicative Gaussian ray jitter std

  # class_weights disabled — caused mode collapse. fg-only amplification with
  # weak bg gradient pushed model to always predict the least-penalized class.
  # Re-add with conservative values (cap at 2.0) once bg suppression is stable.
  # PanNuke distribution: Neo=40.8%, Conn=26.7%, Inflam=17.0%, Epi=14.0%, Dead=1.5%
  class_weights: null

  # Pixel-Level Balancing: area-based fg weighting to boost small nuclei
  plb_enabled: true             # Enable PLB (area-based weighting)
  bg_cls_decay: 1.0             # Bg cls gradient multiplier. 1.0=full bg gradient, 0.0=no bg gradient
  fg_cls_boost: 0.0             # Fg cls boost by alignment quality: weight = 1 + boost * quality (0.0=disabled)

  # Loss weights
  # lambda_xy=500 compensates for sigmoid+stride/imgsz gradient attenuation (~0.008x effective)
  # Effective weighted regression ≈ xy(24) + l1(37) + piou(54) = 115 vs cls(0.94) ≈ 122:1
  # But effective GRADIENT ratio is much lower due to attenuation chain on xy
  lambda_cls: 2.0               # Classification weight
  lambda_xy: 500.0              # Centroid xy weight (high: compensates sigmoid→stride→imgsz attenuation)
  lambda_l1: 14.0               # L1 ray distance weight
  lambda_piou: 13.0             # Polar IoU weight

  # Unified suppression loss: penalises fg anchors that predict higher confidence
  # than they "deserve". deserved = min(quality, uniqueness).
  # quality = assigner alignment score; uniqueness = 1 - spatial proximity to other-GT anchors.
  # Teaches cls head to suppress duplicate predictions and rank same-GT anchors.
  lambda_suppress: 0.0           # Disabled — train24 showed it hurts (spatial repulsion too aggressive for dense nuclei)
  suppress_radius: 0.05          # Normalised repulsion radius (~13px at 256px)

  # Sigma annealing: DISABLED — train13 didn't use this, re-evaluate later
  sigma_anneal_start: 0         # 0 = disabled (use assigner_radius_scale)
  sigma_anneal_end: 0.5
  sigma_anneal_epoch: 200

  # STAL: DISABLED — train13 didn't use this, re-evaluate later
  stal_min_positives: 0         # 0 = disabled

  # GradNorm — disabled; loss-ratio method downweights stuck tasks (xy)
  gradnorm: false

  # Weighted class/tissue sampling
  weighted_sampling: false     # Enable class+ tissue balanced sampling (off by default)
  sampler_gamma: 0.85          # Re-weighting strength (0=uniform, 1=full inverse-frequency)

  # Augmentation (polygon-safe)
  stain_jitter: true         # HSV color jitter for histopathology. Was false
  stain_hsv_h: 0.05          # hue shift range
  stain_hsv_s: 0.3           # saturation scale range (±)
  stain_hsv_v: 0.2           # value/brightness scale range (±)
  stain_blur_prob: 0.2       # probability of Gaussian blur
  stain_blur_sigma: 1.0      # max blur sigma

  scale_augment: true        # random scale augmentation. Was false
  scale_range: [0.7, 1.3]    # min/max scale factors

  translate_augment: true    # random translation augmentation. Was false
  translate_range: 0.1       # fraction of crop_size

  inference_conf: 0.20         # Confidence threshold for inference (was 0.25)

  refinement_kernel_size: 3    # Kernel size for polygon refinement block
                               # 3 = standard RayRefinementBlock (Run 11 baseline)
                               # 7 = LargeKernelRefinementBlock — tested in Run 12, negligible impact

  # Pretrained backbone (COCO weights, layers 0-10 only)
  pretrained_backbone: null  # DISABLED for scratch training experiment 

datasets:
  PanNuke:
    root_dir: "PanNuke/data"
    ingestor: parquet
    native_mpp: 0.25

    split_separation: "filename_regex"
    split_args:
      regex: "(fold[1-3])"
      split_map:
        "fold1": "train"
        "fold2": "val"
        "fold3": "test"
    modality_separation: "bundled_archive"

    namespace_map:
      '0': "Neoplastic"
      '1': "Inflammatory"
      '2': "Connective"
      '3': "Dead"
      '4': "Epithelial"
    tissue_map:
      '0': "Adrenal Gland"
      '1': "Bile Duct"
      '2': "Bladder"
      '3': "Breast"
      '4': "Cervix"
      '5': "Colorectal"
      '6': "Esophagus"
      '7': "Head & Neck"
      '8': "Kidney"
      '9': "Liver"
      '10': "Lung"
      '11': "Ovarian"
      '12': "Pancreatic"
      '13': "Prostate"
      '14': "Skin"
      '15': "Stomach"
      '16': "Testis"
      '17': "Thyroid"
      '18': "Uterus"
