# Run 23: Dual-stream ResoConvDS + HFResidual + C3k2_LK backbone
#
# Architecture:
#   Backbone: ResoConvDS splits DWT into LL (→ C3k2_LK) and HF (stored for neck)
#   Neck: Top-down produces semantic features, then HFResidual adds boundary detail
#          as residual. Bottom-up fuses refined features.
#
# Key difference from Run 20 (single-stream ResoConv):
#   - HF boundary detail bypasses C3k2_LK (which smooths boundaries per Run 18 analysis)
#   - HF injected as residual at neck via HFResidual (DWConv 3×3 + 1×1 boundary path)
#   - SE attention on HF sub-bands before projection (learnable channel weighting)
#
# YAML args for ResoConvDS: [c2, se_r, drop_hh]
#   builder auto-prepends c1, scales c2 by width_multiple
# YAML args for HFResidual: [source_idx]
#   builder links _source to ResoConvDS at that layer index, c2 from input channels

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                        # 0-P1/2
  - [-1, 1, ResoConvDS, [64, 4, False]]              # 1-P2/4 → ll(64), _hf(64)
  - [1, 2, C3k2_LK, [128, False, 0.25, False, 9]]    # 2 f=1(ll), K=9
  - [-1, 1, ResoConvDS, [256, 4, False]]              # 3-P3/8 → ll(256), _hf(256)
  - [3, 2, C3k2_LK, [256, False, 0.25, False, 9]]    # 4 f=3(ll), K=9
  - [-1, 1, ResoConvDS, [512, 4, False]]              # 5-P4/16 → ll(512), _hf(512)
  - [5, 2, C3k2_LK, [512, True, 0.5, False, 7]]      # 6 f=5(ll), K=7
  - [-1, 1, SPPF, [512, 5, 3, True]]                 # 7
  - [-1, 2, C2PSA, [512]]                            # 8

head:
  # Top-down: P4 → P3
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]        # 9
  - [[-1, 4], 1, Concat, [1]]                        # 10
  - [-1, 2, C3k2, [256, True]]                       # 11 — P3_semantic
  - [-1, 1, HFResidual, [3]]                         # 12 — P3 + boundary(hf@3)

  # Top-down: P3 → P2
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 13
  - [[-1, 2], 1, Concat, [1]]                        # 14
  - [-1, 2, C3k2, [128, True]]                       # 15 — P2_semantic
  - [-1, 1, HFResidual, [1]]                         # 16 — P2 + boundary(hf@1)

  # Bottom-up: P2 → P3
  - [-1, 1, ResoConv, [128, False]]                   # 17 — downsample P2→P3
  - [[-1, 12], 1, Concat, [1]]                       # 18 — down + P3_with_HF
  - [-1, 2, C3k2, [256, True]]                       # 19

  # Bottom-up: P3 → P4
  - [-1, 1, ResoConv, [256, False]]                   # 20 — downsample P3→P4
  - [[-1, 8], 1, Concat, [1]]                        # 21 — down + C2PSA@P4
  - [-1, 2, C3k2, [512, True]]                       # 22

  - [[16, 19, 22], 1, Detect, [nc]]                  # 23 — Detect(P2_HF, P3_up, P4_up)
