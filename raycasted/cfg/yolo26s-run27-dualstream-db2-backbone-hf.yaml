# Run 27: Dual-stream ResoConvDS (db2) + HFResidual in BOTH backbone and neck + standard C3k2
#
# Motivation: Run 24 (db2 dual-stream, standard C3k2) achieved the best
# Centroid F1@12px (0.779). The dual-stream architecture splits DWT into
# LL (→ backbone) and HF (→ neck skip). But the backbone C3k2 blocks never
# see boundary information — they only process the smooth LL subband.
#
# This run injects HFResidual into the backbone after every C3k2 stage,
# giving each backbone block a lightweight boundary residual at the same
# resolution. The neck still gets its own HFResidual injections as before.
#
# Architecture:
#   Backbone: ResoConvDS splits DWT into LL (→ C3k2 → HFResidual) and HF
#             HF is stored for the next injection point
#   Neck:     Top-down C3k2 + HFResidual, bottom-up C3k2 fusion
#
# Differences from Run 24:
#   - HFResidual added after every backbone C3k2 (layers 3, 6, 9)
#
# YAML args for ResoConvDS: [c2, se_r, drop_hh, wavelet_type]
#   builder auto-prepends c1, scales c2 by width_multiple
# YAML args for HFResidual: [source_idx]
#   builder links _source to ResoConvDS at that layer index

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                           # 0-P1/2
  - [-1, 1, ResoConvDS, [64, 4, False, 'db2']]          # 1-P2/4 → ll(64), _hf(64)
  - [1, 2, C3k2, [128, False, 0.25]]                    # 2 f=1(ll)
  - [-1, 1, HFResidual, [1]]                            # 3 inject HF@P2 into backbone
  - [-1, 1, ResoConvDS, [256, 4, False, 'db2']]         # 4-P3/8 → ll(256), _hf(256)
  - [4, 2, C3k2, [256, False, 0.25]]                    # 5 f=4(ll)
  - [-1, 1, HFResidual, [4]]                            # 6 inject HF@P3 into backbone
  - [-1, 1, ResoConvDS, [512, 4, False, 'db2']]         # 7-P4/16 → ll(512), _hf(512)
  - [7, 2, C3k2, [512, True]]                           # 8 f=7(ll)
  - [-1, 1, HFResidual, [7]]                            # 9 inject HF@P4 into backbone
  - [-1, 1, SPPF, [512, 5, 3, True]]                    # 10 - SPPF at P4
  - [-1, 2, C2PSA, [512]]                               # 11 - C2PSA at P4/16

head:
  - [11, 1, nn.Upsample, ['None', 2, 'nearest']]        # 12 upsample C2PSA@P4 → P3
  - [[-1, 5], 1, Concat, [1]]                           # 13 cat backbone P3 (from layer 5)
  - [-1, 2, C3k2, [256, True]]                          # 14 (P3/8-small)
  - [-1, 1, HFResidual, [4]]                            # 15 inject HF from layer 4 ResoConvDS@P3

  - [-1, 1, nn.Upsample, ['None', 2, 'nearest']]        # 16 upsample P3 → P2
  - [[-1, 2], 1, Concat, [1]]                           # 17 cat backbone P2 (from layer 2)
  - [-1, 2, C3k2, [128, True]]                          # 18 (P2/4-tiny)
  - [-1, 1, HFResidual, [1]]                            # 19 inject HF from layer 1 ResoConvDS@P2

  - [-1, 1, Conv, [128, 3, 2]]                          # 20 downsample P2 → P3
  - [[-1, 14], 1, Concat, [1]]                          # 21 cat head P3
  - [-1, 2, C3k2, [256, True]]                          # 22 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                          # 23 downsample P3 → P4
  - [[-1, 11], 1, Concat, [1]]                          # 24 cat backbone P4 (from layer 11)
  - [-1, 2, C3k2, [512, True]]                          # 25 (P4/16-medium)

  - [[18, 22, 25], 1, RayCastDetect, [nc, 1, True]]     # Detect(P2, P3, P4)
