# YOLO26 P2-P4 neck: top-down starts from P4 (layer 6), NOT P5 (layer 10).
# Prevents blurring P5 features through 3× upsampling to P2.
# P4/16 has enough receptive field (~64px) for cell detection at 256px crop.

# Parameters
nc: 80 # number of classes
end2end: True # whether to use end-to-end mode
reg_max: 1 # DFL bins
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone (produces P2/4 through P5/32 — P5 built for pretrained weights but unused in neck)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5, 3, True]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

# YOLO26n head (P2-P4, top-down from P4 layer 6 — NOT from P5 layer 10)
# This prevents blurring P5 features through 3× upsampling to P2
head:
  - [6, 1, nn.Upsample, [None, 2, "nearest"]]  # upsample P4→P3
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 13 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # upsample P3→P2
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 16 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, True]] # 19 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, True]] # 22 (P4/16-medium)

  - [[16, 19, 22], 1, Detect, [nc]] # Detect(P2, P3, P4)
