# Run 20: ResoConv (no shortcut) + C3k2_LK backbone
# Tests: Does removing the avg_pool shortcut force the 1x1 to rely purely on DWT sub-bands?
# Theory: The avg_pool shortcut (C channels of raw features) may dominate the 5C concat,
# drowning out the DWT boundary signal (LH, HL, HH). Without shortcut, projection is 4C→C_out,
# forcing the network to learn from frequency decomposition alone. LL sub-band already carries
# the smooth/average component, making the shortcut redundant.

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ResoConv, [64, False]]                          # 0-P1/2 (DWT, no shortcut)
  - [-1, 1, ResoConv, [128, False]]                         # 1-P2/4 (DWT, no shortcut)
  - [-1, 2, C3k2_LK, [256, False, 0.25, False, 9]]         # 2 P2/4 K=9
  - [-1, 1, ResoConv, [256, False]]                         # 3-P3/8 (DWT, no shortcut)
  - [-1, 2, C3k2_LK, [512, False, 0.25, False, 9]]         # 4 P3/8 K=9
  - [-1, 1, ResoConv, [512, False]]                         # 5-P4/16 (DWT, no shortcut)
  - [-1, 2, C3k2_LK, [512, True, 0.5, False, 7]]           # 6 P4/16 K=7
  - [-1, 1, SPPF, [512, 5, 3, True]]                        # 7
  - [-1, 2, C2PSA, [512]]                                   # 8

head:
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, True]]

  - [-1, 1, ResoConv, [128, False]]                         # 15 P2->P3 (DWT, no shortcut)
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]

  - [-1, 1, ResoConv, [256, False]]                         # 18 P3->P4 (DWT, no shortcut)
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [[14, 17, 20], 1, Detect, [nc]]
