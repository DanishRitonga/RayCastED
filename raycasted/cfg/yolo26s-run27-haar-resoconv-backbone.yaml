# Run 27: Pure Haar (db1) wavelet ResoConv — single-stream, no LK
#
# Motivation: WaveConvX (2025 IEEE SMC) showed Haar outperforms db2/sym4/db4
# by 1.2-3.4% on histopathology classification. Haar's 2-tap step function
# is the natural edge detector for cell boundaries. The network learns to
# handle Haar's shift-variance through augmentation and downstream convs.
#
# Advantages over db2/bior2.2:
#   - 2-tap filter (vs 4/6): ~2-3x fewer multiply-adds in DWT
#   - Perfect orthogonality: preserves gradient magnitude during backprop
#   - Clean sub-band separation: LH=horizontal, HL=vertical, HH=diagonal edges
#   - Equivalent to average pooling + difference (most natural CNN replacement)
#
# Architecture: identical to Run 25 (standard C3k2, no LK), using ResoConv
# with wavelet_type='db1' (Haar via pywt) instead of ResoConvHybrid.
# Single-stream: DWT → concat shortcut → 1x1 projection.
#
# ONNX/TensorRT: Haar uses 2x2 depthwise conv (same as other wavelets),
# no custom ops. Fully exportable.
#
# Baseline: Run 25 (bior2.2+db2 hybrid) = TBD
#            Run 14b (db2 full no-LK) = mAP@0.5 0.432, SQ 0.750

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26s backbone — ResoConv with Haar (db1) replaces all strided Conv
# Args: [c_out, shortcut, drop_hh, wavelet_type]
backbone:
  - [-1, 1, ResoConv, [64, True, False, 'db1']]    # 0-P1/2
  - [-1, 1, ResoConv, [128, True, False, 'db1']]   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, ResoConv, [256, True, False, 'db1']]   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, ResoConv, [512, True, False, 'db1']]   # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, SPPF, [512, 5, 3, True]]               # 7
  - [-1, 2, C2PSA, [512]]                           # 8

# YOLO26s neck (P3-P4 FPN/PAN with ResoConv Haar in PAN downsample)
head:
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]                      # 14-P3/8

  - [-1, 1, ResoConv, [256, True, False, 'db1']]   # 15
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]                      # 17-P4/16

  - [-1, 1, ResoConv, [512, True, False, 'db1']]   # 18
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]                      # 20

  - [-1, 1, ResoConv, [512, True, False, 'db1']]   # 21-P5/32
  - [[-1, 6], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]                      # 23

  - [[14, 17, 20], 1, RayCastDetect, [nc, reg_max, end2end]]
