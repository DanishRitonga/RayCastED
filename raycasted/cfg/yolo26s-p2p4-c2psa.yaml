# YOLO26 P2-P4 neck with C2PSA at P4 (layer 6), NOT P5 (layer 10).
# This gives P2-P4 detection density while using C2PSA attention features
# and avoiding 3× upsampling blur. C2PSA moves from 1024ch@P5 to 512ch@P4.

# Parameters
nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26n backbone with C2PSA at P4 (no P5 — saves compute)
backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, SPPF, [512, 5, 3, True]] # 7 - SPPF at P4
  - [-1, 2, C2PSA, [512]] # 8 - C2PSA at P4/16 (NOT P5/32)

# YOLO26n head (P2-P4, top-down from C2PSA at layer 8)
head:
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]  # upsample C2PSA@P4 → P3
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, True]] # 11 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # upsample P3 → P2
  - [[-1, 2], 1, Concat, [1]] # cat backbone P2
  - [-1, 2, C3k2, [128, True]] # 14 (P2/4-xsmall)

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P3
  - [-1, 2, C3k2, [256, True]] # 17 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat C2PSA@P4
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16-medium)

  - [[14, 17, 20], 1, Detect, [nc]] # Detect(P2, P3, P4)
