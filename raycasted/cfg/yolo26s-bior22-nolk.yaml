# bior2.2 no-LK: Symmetric wavelet + standard C3k2 backbone + standard neck
# Tests: Does bior2.2's linear-phase/symmetric filtering outperform db2 when
#        LK blocks are removed? Compares directly to run21-nolk (db2 no-LK).
# Theory: bior2.2 has zero phase shift → sub-band responses centered on true
#         feature locations. Without LK reparameterization, boundary quality
#         depends more on clean sub-band definitions.
#
# Results (PanNuke Fold3, conf=0.2):
#   mAP@0.5: 0.4094 | PQ: 0.5419 | SQ: 0.7455 | DQ: 0.6804 | F1: 0.6298
#
# Comparison:
#   run21-nolk (db2):     not yet run
#   run21 (db2 + LK):     mAP@0.5=0.414, SQ=0.747, DQ=0.670
#   run14b (db2 full):    mAP@0.5=0.432, SQ=0.750
#   run22 (bior2.2 + LK): not yet evaluated

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ResoConv, [64, True, False, 'bior2.2']]      # 0-P1/2   (DWT, shortcut, keep HH)
  - [-1, 1, ResoConv, [128, True, False, 'bior2.2']]     # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]                    # 2 P2/4   (standard, NOT LK)
  - [-1, 1, ResoConv, [256, True, False, 'bior2.2']]     # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]                    # 4 P3/8   (standard, NOT LK)
  - [-1, 1, ResoConv, [512, True, False, 'bior2.2']]     # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                           # 6 P4/16  (standard, NOT LK)
  - [-1, 1, SPPF, [512, 5, 3, True]]                     # 7 - SPPF at P4
  - [-1, 2, C2PSA, [512]]                                # 8 - C2PSA at P4/16

head:
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]            # upsample C2PSA@P4 → P3
  - [[-1, 4], 1, Concat, [1]]                            # cat backbone P3
  - [-1, 2, C3k2, [256, True]]                           # 11 (P3/8-small, standard)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]            # upsample P3 → P2
  - [[-1, 2], 1, Concat, [1]]                            # cat backbone P2
  - [-1, 2, C3k2, [128, True]]                           # 14 (P2/4-xsmall, standard)

  - [-1, 1, ResoConv, [128, True, False, 'bior2.2']]     # 15 P2->P3
  - [[-1, 11], 1, Concat, [1]]                           # cat head P3
  - [-1, 2, C3k2, [256, True]]                           # 17 (P3/8-small, standard)

  - [-1, 1, ResoConv, [256, True, False, 'bior2.2']]     # 18 P3->P4
  - [[-1, 8], 1, Concat, [1]]                            # cat C2PSA@P4
  - [-1, 2, C3k2, [512, True]]                           # 20 (P4/16-medium, standard)

  - [[14, 17, 20], 1, Detect, [nc]]                      # Detect(P2, P3, P4)
