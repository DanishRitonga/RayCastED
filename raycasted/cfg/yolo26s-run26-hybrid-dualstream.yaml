# Run 26: Dual-stream ResoConvDS_Hybrid (bior2.2 LL + db2 HF) + standard C3k2 backbone
#
# Motivation: Run 25 (hybrid single-stream) achieved best-ever AJI (0.563) and
# mAP@0.5 (0.428). Run 24 (db2 dual-stream) achieved best-ever Centroid F1@12px
# (0.779). This run combines BOTH innovations:
#   - Hybrid wavelet: bior2.2 LL (strong approximation) + db2 HF (sharp edges)
#   - Dual-stream architecture: LL → backbone, HF → neck residual
#
# Theory: bior2.2's symmetric 6-tap filters give cleaner LL energy for backbone
# feature extraction, while db2's sharper HF response preserves boundaries for
# the neck. Dual-stream separation prevents cross-band interference.
#
# Differences from Run 24:
#   - ResoConvDS_Hybrid replaces ResoConvDS (hybrid wavelet instead of single)
#
# YAML args for ResoConvDS_Hybrid: [c2, se_r, drop_hh]
#   builder auto-prepends c1, scales c2 by width_multiple
#   No wavelet_type arg (hybrid is fixed: bior2.2 LL + db2 HF)
# YAML args for HFResidual: [source_idx]
#   builder links _source to ResoConvDS_Hybrid at that layer index

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                           # 0-P1/2
  - [-1, 1, ResoConvDS_Hybrid, [64, 4, False]]          # 1-P2/4 → ll(64), _hf(64)
  - [1, 2, C3k2, [128, False, 0.25]]                    # 2 f=1(ll)
  - [-1, 1, ResoConvDS_Hybrid, [256, 4, False]]         # 3-P3/8 → ll(256), _hf(256)
  - [3, 2, C3k2, [256, False, 0.25]]                    # 4 f=3(ll)
  - [-1, 1, ResoConvDS_Hybrid, [512, 4, False]]         # 5-P4/16 → ll(512), _hf(512)
  - [5, 2, C3k2, [512, True]]                           # 6 f=5(ll)
  - [-1, 1, SPPF, [512, 5, 3, True]]                    # 7 - SPPF at P4
  - [-1, 2, C2PSA, [512]]                               # 8 - C2PSA at P4/16

head:
  - [8, 1, nn.Upsample, ['None', 2, 'nearest']]         # upsample C2PSA@P4 → P3
  - [[-1, 4], 1, Concat, [1]]                           # cat backbone P3 (from layer 4 f=3)
  - [-1, 2, C3k2, [256, True]]                          # 11 (P3/8-small)
  - [-1, 1, HFResidual, [3]]                            # inject HF from layer 3 ResoConvDS_Hybrid@P3

  - [-1, 1, nn.Upsample, ['None', 2, 'nearest']]        # upsample P3 → P2
  - [[-1, 2], 1, Concat, [1]]                           # cat backbone P2 (from layer 2 f=1)
  - [-1, 2, C3k2, [128, True]]                          # 15 (P2/4-xsmall)
  - [-1, 1, HFResidual, [1]]                            # inject HF from layer 1 ResoConvDS_Hybrid@P2

  - [-1, 1, ResoConv, [128, False, False, 'db2']]       # 16 P2->P3 (DWT, no shortcut, keep HH)
  - [[-1, 11], 1, Concat, [1]]                          # cat head P3
  - [-1, 2, C3k2, [256, True]]                          # 18 (P3/8-small)

  - [-1, 1, ResoConv, [256, False, False, 'db2']]       # 19 P3->P4 (DWT, no shortcut, keep HH)
  - [[-1, 8], 1, Concat, [1]]                           # cat C2PSA@P4
  - [-1, 2, C3k2, [512, True]]                          # 21 (P4/16-medium)

  - [[15, 18, 21], 1, Detect, ['nc']]                   # Detect(P2, P3, P4)
