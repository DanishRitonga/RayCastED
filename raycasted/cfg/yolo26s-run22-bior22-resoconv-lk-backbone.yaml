# Run 22: ResoConv (bior2.2, no shortcut) + C3k2_LK backbone
# Tests: Does symmetric/linear-phase wavelet (bior2.2) improve boundary regression vs db2?
# Theory: bior2.2 has symmetric filters → zero phase shift → sub-band responses centered
# on true feature locations. db2 (asymmetric) introduces ~1-2px shift in HF sub-bands.
# With reflection padding the difference is small, but symmetric filters give cleaner
# sub-band symmetry around features. Same architecture as Run 20, only wavelet changed.
# bior2.2: 6-tap, 2 vanishing moments, symmetric, linear phase, non-orthogonal
# db2:      4-tap, 2 vanishing moments, asymmetric, nonlinear phase, orthogonal

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ResoConv, [64, False]]                          # 0-P1/2 (DWT, no shortcut)
  - [-1, 1, ResoConv, [128, False]]                         # 1-P2/4 (DWT, no shortcut)
  - [-1, 2, C3k2_LK, [256, False, 0.25, False, 9]]         # 2 P2/4 K=9
  - [-1, 1, ResoConv, [256, False]]                         # 3-P3/8 (DWT, no shortcut)
  - [-1, 2, C3k2_LK, [512, False, 0.25, False, 9]]         # 4 P3/8 K=9
  - [-1, 1, ResoConv, [512, False]]                         # 5-P4/16 (DWT, no shortcut)
  - [-1, 2, C3k2_LK, [512, True, 0.5, False, 7]]           # 6 P4/16 K=7
  - [-1, 1, SPPF, [512, 5, 3, True]]                        # 7
  - [-1, 2, C2PSA, [512]]                                   # 8

head:
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, True]]

  - [-1, 1, ResoConv, [128, False]]                         # 15 P2->P3 (DWT, no shortcut)
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]

  - [-1, 1, ResoConv, [256, False]]                         # 18 P3->P4 (DWT, no shortcut)
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [[14, 17, 20], 1, Detect, [nc]]
