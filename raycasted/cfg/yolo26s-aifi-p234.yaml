# AIFI-Lite on P4: single TransformerEncoderLayer for global context
#
# Based on yolo26s-run28-p234.yaml (P2-P3-P4 pyramid).
# Adds AIFIBlock between backbone P4 output and neck FPN upsample.
#
# AIFI (Attention-based Intra-scale Feature Interaction) from RT-DETR (CVPR 2024)
# applies multi-head self-attention on the P4 feature map (16x16 = 256 tokens).
# This gives P4 — and by FPN propagation, P3 and P2 — global spatial context
# that pure convolution cannot provide.
#
# Key difference from AnchorSelfAttention (train31/32, DEAD END):
# - AnchorSelfAttention operated on cls HEAD features (after DWConv+Conv, 98.7% bg)
# - AIFI operates on NECK/BACKBONE features (before head, structural information)
# - AIFI uses standard O(N^2) MHA (256 tokens trivial), not linear attention
# - AIFI enriches feature quality for ALL branches (o2m + o2o), not just o2o cls

nc: 5
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26s backbone — identical to run28-p234
backbone:
  - [-1, 1, ResoConvHybrid, [64]]           # 0-P1/2
  - [-1, 1, ResoConvHybrid, [128]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2   (P2 features, 64x64)
  - [-1, 1, ResoConvHybrid, [256]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]      # 4   (P3 features, 32x32)
  - [-1, 1, ResoConvHybrid, [512]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]             # 6
  - [-1, 1, SPPF, [512, 5, 3, True]]       # 7
  - [-1, 2, C2PSA, [512]]                  # 8   (P4 features, 16x16)

# YOLO26s neck — AIFI-Lite on P4 + P2-P3-P4 FPN/PAN
head:
  # --- AIFI-Lite on P4: global self-attention before FPN ---
  - [8, 1, AIFIBlock, [256, 1024, 8]]       # 9   AIFI on P4 (aifi_dim=256, cm=1024, heads=8)

  # --- FPN upsample path (P4 → P3 → P2) ---
  - [9, 1, nn.Upsample, [None, 2, "nearest"]]              # 10
  - [[-1, 4], 1, Concat, [1]]                               # 11  concat with P3 backbone
  - [-1, 2, C3k2, [256, True]]                              # 12  P3 FPN (32x32)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]              # 13
  - [[-1, 2], 1, Concat, [1]]                               # 14  concat with P2 backbone
  - [-1, 2, C3k2, [128, True]]                              # 15  P2 FPN (64x64) ← detect

  # --- PAN downsample path (P2 → P3 → P4) ---
  - [-1, 1, ResoConvHybrid, [128]]                          # 16  downsample P2→P3 scale
  - [[-1, 12], 1, Concat, [1]]                              # 17  concat with P3 FPN
  - [-1, 2, C3k2, [256, True]]                              # 18  P3 PAN (32x32) ← detect

  - [-1, 1, ResoConvHybrid, [256]]                          # 19  downsample P3→P4 scale
  - [[-1, 9], 1, Concat, [1]]                               # 20  concat with P4 (AIFI-enhanced)
  - [-1, 2, C3k2, [512, True]]                              # 21  P4 PAN (16x16) ← detect

  # --- Detection head: P2-P3-P4 ---
  - [[15, 18, 21], 1, RayCastDetect, [nc, reg_max, end2end]]
