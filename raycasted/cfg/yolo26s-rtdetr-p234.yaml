# RayCast RT-DETR — P2-P3-P4 pyramid with Transformer Decoder
#
# Same backbone + neck as yolo26s-run28-p234.yaml, but replaces the
# FCN RayCastDetect head with RayCastRTDETRDecoder (deformable transformer
# decoder with ray polygon regression).
#
# This is a sanity check: if RT-DETR + RayCast outperforms the FCN version,
# it confirms that the FCN's lack of selective feature access (gotcha #39)
# is the bottleneck. If it also fails, the problem is more fundamental.

nc: 5
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26s backbone — identical to run28-p234
backbone:
  - [-1, 1, ResoConvHybrid, [64]]           # 0-P1/2
  - [-1, 1, ResoConvHybrid, [128]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2   (P2 features, 64x64)
  - [-1, 1, ResoConvHybrid, [256]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]      # 4   (P3 features, 32x32)
  - [-1, 1, ResoConvHybrid, [512]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]             # 6
  - [-1, 1, SPPF, [512, 5, 3, True]]       # 7
  - [-1, 2, C2PSA, [512]]                  # 8   (P4 features, 16x16)

# YOLO26s neck — P2-P3-P4 FPN/PAN (same as run28-p234)
head:
  # --- FPN upsample path (P4 → P3 → P2) ---
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]              # 9
  - [[-1, 4], 1, Concat, [1]]                               # 10  concat with P3 backbone
  - [-1, 2, C3k2, [256, True]]                              # 11  P3 FPN (32x32)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]              # 12
  - [[-1, 2], 1, Concat, [1]]                               # 13  concat with P2 backbone
  - [-1, 2, C3k2, [128, True]]                              # 14  P2 FPN (64x64)

  # --- PAN downsample path (P2 → P3 → P4) ---
  - [-1, 1, ResoConvHybrid, [128]]                          # 15  downsample P2→P3 scale
  - [[-1, 11], 1, Concat, [1]]                              # 16  concat with P3 FPN
  - [-1, 2, C3k2, [256, True]]                              # 17  P3 PAN (32x32)

  - [-1, 1, ResoConvHybrid, [256]]                          # 18  downsample P3→P4 scale
  - [[-1, 8], 1, Concat, [1]]                               # 19  concat with P4 backbone
  - [-1, 2, C3k2, [512, True]]                              # 20  P4 PAN (16x16)

  # --- RayCast RT-DETR Decoder: P2-P3-P4 ---
  # Args: [nc, hd, nq, ndp, nh, ndl, d_ffn, dropout, nd, n_rays, query_stride]
  # query_stride=16 → 16×16 grid of 256 queries (LSP-DETR style, no encoder score head)
  - [[14, 17, 20], 1, RayCastRTDETRDecoder, [5, 256, 100, 4, 8, 6, 1024, 0.0, 20, 64, 16]]
