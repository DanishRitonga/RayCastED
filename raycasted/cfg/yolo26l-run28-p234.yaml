# Run 28: P2-P3-P4 pyramid — dense grid for nuclei detection
#
# Motivation: P3-P4-P5 pyramid (stride 8/16/32) has only 1344 anchors for
# ~200 nuclei per 256px tile. In dense clusters, multiple nuclei collide on
# the same stride-8 anchor, creating unrecoverable false negatives (recall
# ceiling ~74%). Shifting to P2-P3-P4 (stride 4/8/16) gives 5376 anchors,
# dropping oversubscription from 3x to 0.74x.
#
# P5/32 is removed — 8x8 coarse anchors are useless for 5-15px nuclei.
# P2/4 adds a 64x64 fine grid that resolves touching-cell collisions.
#
# Backbone: identical to Run 25 (ResoConv Haar wavelet, C3k2, C2PSA).
# Neck: standard FPN/PAN shifted one level down.
#   - FPN upsample: P4→P3→P2 (concat backbone P3/P2)
#   - PAN downsample: P2→P3→P4 (concat FPN P3, backbone P4)
#   - Detection at P2/4 (layer 13), P3/8 (layer 16), P4/16 (layer 19)

nc: 5
end2end: True
reg_max: 1
depth_multiple: 1.0
width_multiple: 2.0
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26s backbone — identical to Run 25 (SPPF removed: max-pool smears nuclei features into bg)
backbone:
  - [-1, 1, ResoConv, [64]]           # 0-P1/2
  - [-1, 1, ResoConv, [128]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]      # 2   (P2 features, 64x64)
  - [-1, 1, ResoConv, [256]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]      # 4   (P3 features, 32x32)
  - [-1, 1, ResoConv, [512]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]             # 6
  - [-1, 2, C2PSA, [512]]                  # 7   (P4 features, 16x16)

# YOLO26s neck — P2-P3-P4 FPN/PAN
head:
  # --- FPN upsample path (P4 → P3 → P2) ---
  - [7, 1, nn.Upsample, [None, 2, "nearest"]]              # 8
  - [[-1, 4], 1, Concat, [1]]                               # 9   concat with P3 backbone
  - [-1, 2, C3k2, [256, True]]                              # 10  P3 FPN (32x32)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]              # 11
  - [[-1, 2], 1, Concat, [1]]                               # 12  concat with P2 backbone
  - [-1, 2, C3k2, [128, True]]                              # 13  P2 FPN (64x64) ← detect

  # --- PAN downsample path (P2 → P3 → P4) ---
  - [-1, 1, ResoConv, [128]]                          # 14  downsample P2→P3 scale
  - [[-1, 10], 1, Concat, [1]]                              # 15  concat with P3 FPN
  - [-1, 2, C3k2, [256, True]]                              # 16  P3 PAN (32x32) ← detect

  - [-1, 1, ResoConv, [256]]                          # 17  downsample P3→P4 scale
  - [[-1, 7], 1, Concat, [1]]                               # 18  concat with P4 backbone
  - [-1, 2, C3k2, [512, True]]                              # 19  P4 PAN (16x16) ← detect

  # --- Detection head: P2-P3-P4 ---
  - [[13, 16, 19], 1, RayCastDetect, [nc, reg_max, end2end]]
