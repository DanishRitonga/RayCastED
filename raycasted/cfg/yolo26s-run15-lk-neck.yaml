# Run 15: C3k2_LK neck only (no DWT)
# Tests: Do large-kernel blocks in the neck (feature fusion) improve DQ?

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]           # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]   # 2 (standard C3k2 in backbone)
  - [-1, 1, Conv, [256, 3, 2]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]   # 4 (standard C3k2 in backbone)
  - [-1, 1, Conv, [512, 3, 2]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]          # 6 (standard C3k2 in backbone)
  - [-1, 1, SPPF, [512, 5, 3, True]]    # 7
  - [-1, 2, C2PSA, [512]]               # 8

head:
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2_LK, [256, True, 0.5, False, 9]]    # 11 P3/8 K=9

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2_LK, [128, True, 0.5, False, 13]]   # 14 P2/4 K=13

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2_LK, [256, True, 0.5, False, 9]]    # 17 P3/8 K=9

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2_LK, [512, True, 0.5, False, 7]]    # 20 P4/16 K=7

  - [[14, 17, 20], 1, Detect, [nc]]
