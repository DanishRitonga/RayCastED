# Run 27: Haar (db1) ResoConv — single-stream, no LK
#
# Motivation: WaveConvX (IEEE SMC 2025) showed Haar outperforms db2/bior2.2
# by 1.2-3.4% on histopathology classification. Haar's 2-tap step function
# is the ideal edge detector for cell membrane boundaries in H&E staining.
#
# Advantages over db2/bior2.2:
#   - Sharpest edge response (step function = perfect for cell boundaries)
#   - Orthogonal (preserves gradient magnitude for training stability)
#   - 2-tap filter (fastest DWT, minimal compute overhead)
#   - Standard in wavelet-NN literature (WaveCNet, HDCNet, LKCell)
#
# Trade-off: Haar is shift-variant, but network learns robustness via
# augmentation + convolution layers. ResoConv shortcut mitigates alignment.
#
# Architecture: identical to Run 25 (single-stream C3k2, no LK), only DWT
# filters change from bior2.2/db2 hybrid to pure db1 (Haar).
#
# Baseline: Run 25 (hybrid bior2.2+db2) = AJI 0.563, mAP@0.5 0.428

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26s backbone — ResoConv (Haar) replaces all strided Conv
# Args: [c2, shortcut, drop_hh, wavelet_type]
backbone:
  - [-1, 1, ResoConv, [64, True, False, db1]]    # 0-P1/2
  - [-1, 1, ResoConv, [128, True, False, db1]]   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, ResoConv, [256, True, False, db1]]   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, ResoConv, [512, True, False, db1]]   # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, SPPF, [512, 5, 3, True]]
  - [-1, 2, C2PSA, [512]]

# YOLO26s head (P2-P4, standard 3x3 neck)
head:
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]                  # 15 (P2/4-small)

  - [-1, 1, ResoConv, [256, True, False, db1]]  # 16 downsample
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]                  # 18 (P3/8-medium)

  - [-1, 1, ResoConv, [256, True, False, db1]]  # 19 downsample
  - [[-1, 9], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]                  # 21 (P4/16-large)
