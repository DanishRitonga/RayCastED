# Run 25: Hybrid wavelet ResoConv — bior2.2 LL + db2 HF, no LK
#
# Motivation: bior2.2 produces stronger, symmetric LL energy ideal for
# coarse approximation, while db2's asymmetric orthogonal HF response
# captures sharper cell boundaries. Hybrid DWT combines the best of both.
#
# Architecture: identical to Run 14b (standard C3k2, no LK), only DWT
# filters change. Each ResoConvHybrid uses:
#   - bior2.2 for LL sub-band (low-pass approximation)
#   - db2 for LH, HL, HH sub-bands (high-frequency detail)
#
# Theory: bior2.2's 6-tap symmetric filters give ~2dB stronger LL energy
# than db2's 4-tap asymmetric, improving feature stability. db2's sharper
# roll-off in HF preserves edge discontinuities better than bior2.2's
# smoother sub-bands, which is critical for polygon boundary regression.
#
# Baseline: Run 14b (db2 full no-LK) = mAP@0.5 0.432, SQ 0.750

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# YOLO26s backbone — ResoConvHybrid replaces all strided Conv
backbone:
  - [-1, 1, ResoConvHybrid, [64]]           # 0-P1/2
  - [-1, 1, ResoConvHybrid, [128]]          # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, ResoConvHybrid, [256]]          # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, ResoConvHybrid, [512]]          # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, SPPF, [512, 5, 3, True]]       # 7 - SPPF at P4
  - [-1, 2, C2PSA, [512]]                  # 8 - C2PSA at P4/16

# YOLO26s head (P2-P4) — standard top-down FPN + bottom-up PAN
head:
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]   # upsample C2PSA@P4 → P3
  - [[-1, 4], 1, Concat, [1]]                    # cat backbone P3
  - [-1, 2, C3k2, [256, True]]                   # 11 (P3/8-small)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # upsample P3 → P2
  - [[-1, 2], 1, Concat, [1]]                    # cat backbone P2
  - [-1, 2, C3k2, [128, True]]                   # 14 (P2/4-xsmall)

  - [-1, 1, ResoConvHybrid, [128]]               # 15 P2->P3
  - [[-1, 11], 1, Concat, [1]]                   # cat head P3
  - [-1, 2, C3k2, [256, True]]                   # 17 (P3/8-small)

  - [-1, 1, ResoConvHybrid, [256]]               # 18 P3->P4
  - [[-1, 8], 1, Concat, [1]]                    # cat C2PSA@P4
  - [-1, 2, C3k2, [512, True]]                   # 20 (P4/16-medium)

  - [[14, 17, 20], 1, Detect, [nc]]              # Detect(P2, P3, P4)
