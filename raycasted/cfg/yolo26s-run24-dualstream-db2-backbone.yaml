# Run 24: Dual-stream ResoConvDS (db2) + HFResidual + standard C3k2 backbone
#
# Motivation: Run 23 (bior2.2 dual-stream) showed dual-stream architecture
# improves mAP by +1.2 over single-stream bior2.2. Since db2 is the overall
# best wavelet (Run 14b: mAP 0.432), applying dual-stream to db2 should
# isolate whether the architecture itself helps the best-performing wavelet.
#
# Theory: db2 already has strong HF response; dual-stream may further
# improve by preventing LL/HF interference in the projection Conv.
#
# Architecture:
#   Backbone: ResoConvDS splits DWT into LL (→ C3k2) and HF (stored for neck)
#   Neck: Top-down produces semantic features, then HFResidual adds boundary detail
#          as residual. Bottom-up fuses refined features.
#
# Differences from Run 23:
#   - db2 wavelet instead of bior2.2 ( sharper edge response )
#   - Otherwise identical architecture
#
# YAML args for ResoConvDS: [c2, se_r, drop_hh, wavelet_type]
#   builder auto-prepends c1, scales c2 by width_multiple
# YAML args for HFResidual: [source_idx]
#   builder links _source to ResoConvDS at that layer index, c2 from input channels

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                           # 0-P1/2
  - [-1, 1, ResoConvDS, [64, 4, False, 'db2']]          # 1-P2/4 → ll(64), _hf(64)
  - [1, 2, C3k2, [128, False, 0.25]]                    # 2 f=1(ll)
  - [-1, 1, ResoConvDS, [256, 4, False, 'db2']]         # 3-P3/8 → ll(256), _hf(256)
  - [3, 2, C3k2, [256, False, 0.25]]                    # 4 f=3(ll)
  - [-1, 1, ResoConvDS, [512, 4, False, 'db2']]         # 5-P4/16 → ll(512), _hf(512)
  - [5, 2, C3k2, [512, True]]                           # 6 f=5(ll)
  - [-1, 1, SPPF, [512, 5, 3, True]]                    # 7 - SPPF at P4
  - [-1, 2, C2PSA, [512]]                               # 8 - C2PSA at P4/16

head:
  - [8, 1, nn.Upsample, ['None', 2, 'nearest']]         # upsample C2PSA@P4 → P3
  - [[-1, 4], 1, Concat, [1]]                           # cat backbone P3 (from layer 4 f=3)
  - [-1, 2, C3k2, [256, True]]                          # 11 (P3/8-small)
  - [-1, 1, HFResidual, [3]]                            # inject HF from layer 3 ResoConvDS@P3

  - [-1, 1, nn.Upsample, ['None', 2, 'nearest']]        # upsample P3 → P2
  - [[-1, 2], 1, Concat, [1]]                           # cat backbone P2 (from layer 2 f=1)
  - [-1, 2, C3k2, [128, True]]                          # 15 (P2/4-xsmall)
  - [-1, 1, HFResidual, [1]]                            # inject HF from layer 1 ResoConvDS@P2

  - [-1, 1, ResoConv, [128, False, False, 'db2']]       # 16 P2->P3 (DWT, no shortcut, keep HH)
  - [[-1, 11], 1, Concat, [1]]                          # cat head P3
  - [-1, 2, C3k2, [256, True]]                          # 18 (P3/8-small)

  - [-1, 1, ResoConv, [256, False, False, 'db2']]       # 19 P3->P4 (DWT, no shortcut, keep HH)
  - [[-1, 8], 1, Concat, [1]]                           # cat C2PSA@P4
  - [-1, 2, C3k2, [512, True]]                          # 21 (P4/16-medium)

  - [[15, 18, 21], 1, Detect, ['nc']]                   # Detect(P2, P3, P4)
