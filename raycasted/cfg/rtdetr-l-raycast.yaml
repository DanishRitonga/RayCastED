# RayCast RT-DETR-L — HGNetV2-L backbone + AIFI + RepC3 + RayCastRTDETRDecoder
#
# Standard RT-DETR-L architecture with the 4-dim bbox decoder replaced by
# a 66-dim ray polygon decoder (2 xy + 64 rays). This is the "real" RT-DETR
# baseline — same backbone, neck, and decoder as COCO-pretrained RT-DETR-L,
# only the head output changes.

nc: 5
end2end: True
reg_max: 1
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, HGStem, [32, 48]]           # 0-P2/4
  - [-1, 6, HGBlock, [48, 128, 3]]       # 1 stage 1

  - [-1, 1, DWConv, [128, 3, 2, 1, False]]  # 2-P3/8
  - [-1, 6, HGBlock, [96, 512, 3]]       # 3 stage 2

  - [-1, 1, DWConv, [512, 3, 2, 1, False]]  # 4-P4/16
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]]  # 5
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]   # 6
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]   # 7 stage 3

  - [-1, 1, DWConv, [1024, 3, 2, 1, False]]  # 8-P5/32
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]]  # 9 stage 4

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]  # 10 input_proj.2
  - [-1, 1, AIFI, [1024, 8]]                          # 11
  - [-1, 1, Conv, [256, 1, 1]]                        # 12 Y5 lateral

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 13
  - [7, 1, Conv, [256, 1, 1, None, 1, 1, False]]     # 14 input_proj.1
  - [[-2, -1], 1, Concat, [1]]                       # 15
  - [-1, 3, RepC3, [256]]                            # 16 fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]                        # 17 Y4 lateral

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]       # 18
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]]     # 19 input_proj.0
  - [[-2, -1], 1, Concat, [1]]                       # 20
  - [-1, 3, RepC3, [256]]                            # 21 X3 fpn_blocks.1

  - [-1, 1, Conv, [256, 3, 2]]                       # 22 downsample
  - [[-1, 17], 1, Concat, [1]]                        # 23 cat Y4
  - [-1, 3, RepC3, [256]]                            # 24 F4 pan_blocks.0

  - [-1, 1, Conv, [256, 3, 2]]                       # 25 downsample
  - [[-1, 12], 1, Concat, [1]]                       # 26 cat Y5
  - [-1, 3, RepC3, [256]]                            # 27 F5 pan_blocks.1

  # RayCast RT-DETR Decoder: P3, P4, P5
  # Args: [nc, hd, nq, ndp, nh, ndl, d_ffn, dropout, nd, n_rays]
  - [[21, 24, 27], 1, RayCastRTDETRDecoder, [5, 256, 100, 4, 8, 6, 1024, 0.0, 0, 64]]
