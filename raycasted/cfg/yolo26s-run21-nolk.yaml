# Run 21 without LK: ResoConv no-HH (db2) + standard C3k2 backbone + standard neck
# Tests: Does dropping HH sub-band help when combined with standard backbone?
# Baseline: Run 14b (ResoConv db2 full) = mAP@0.5 0.432, SQ 0.750
# Run 21 (ResoConv no-HH + LK) = mAP@0.5 0.414, SQ 0.747, DQ 0.670
# Theory: HH carries diagonal edges; cell boundaries are mostly horizontal/vertical.
# Removing HH saves ~0.2M params and may reduce noise without losing signal.

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ResoConv, [64, True, True, 'db2']]           # 0-P1/2   (DWT, shortcut, drop_hh, db2)
  - [-1, 1, ResoConv, [128, True, True, 'db2']]          # 1-P2/4   (DWT, shortcut, drop_hh, db2)
  - [-1, 2, C3k2, [256, False, 0.25]]                    # 2 P2/4   (standard, NOT LK)
  - [-1, 1, ResoConv, [256, True, True, 'db2']]          # 3-P3/8   (DWT, shortcut, drop_hh, db2)
  - [-1, 2, C3k2, [512, False, 0.25]]                    # 4 P3/8   (standard, NOT LK)
  - [-1, 1, ResoConv, [512, True, True, 'db2']]          # 5-P4/16  (DWT, shortcut, drop_hh, db2)
  - [-1, 2, C3k2, [512, True]]                           # 6 P4/16  (standard, NOT LK)
  - [-1, 1, SPPF, [512, 5, 3, True]]                     # 7 - SPPF at P4
  - [-1, 2, C2PSA, [512]]                                # 8 - C2PSA at P4/16

head:
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]            # upsample C2PSA@P4 → P3
  - [[-1, 4], 1, Concat, [1]]                            # cat backbone P3
  - [-1, 2, C3k2, [256, True]]                           # 11 (P3/8-small, standard)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]            # upsample P3 → P2
  - [[-1, 2], 1, Concat, [1]]                            # cat backbone P2
  - [-1, 2, C3k2, [128, True]]                           # 14 (P2/4-xsmall, standard)

  - [-1, 1, ResoConv, [128, True, True, 'db2']]          # 15 P2->P3 (DWT, drop_hh, db2)
  - [[-1, 11], 1, Concat, [1]]                           # cat head P3
  - [-1, 2, C3k2, [256, True]]                           # 17 (P3/8-small, standard)

  - [-1, 1, ResoConv, [256, True, True, 'db2']]          # 18 P3->P4 (DWT, drop_hh, db2)
  - [[-1, 8], 1, Concat, [1]]                            # cat C2PSA@P4
  - [-1, 2, C3k2, [512, True]]                           # 20 (P4/16-medium, standard)

  - [[14, 17, 20], 1, Detect, [nc]]                      # Detect(P2, P3, P4)
