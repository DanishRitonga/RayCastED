# Run 21: ResoConv (no shortcut, no HH) + C3k2_LK backbone
# Tests: Does dropping the HH sub-band (diagonal noise) improve the 1x1 projection?
# Theory: HH captures diagonal high-frequency noise (staining artifacts, texture) that
# dilutes the useful boundary signal from LH (vertical edges) and HL (horizontal edges).
# Prior work in wavelet denoising and JPEG2000 routinely discards HH first.
# With shortcut=False + drop_hh=True, projection is 3C→C_out instead of 5C→C_out.

nc: 80
end2end: True
reg_max: 1
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, ResoConv, [64, False, True]]                      # 0-P1/2 (DWT, no shortcut, no HH)
  - [-1, 1, ResoConv, [128, False, True]]                     # 1-P2/4 (DWT, no shortcut, no HH)
  - [-1, 2, C3k2_LK, [256, False, 0.25, False, 9]]           # 2 P2/4 K=9
  - [-1, 1, ResoConv, [256, False, True]]                     # 3-P3/8 (DWT, no shortcut, no HH)
  - [-1, 2, C3k2_LK, [512, False, 0.25, False, 9]]           # 4 P3/8 K=9
  - [-1, 1, ResoConv, [512, False, True]]                     # 5-P4/16 (DWT, no shortcut, no HH)
  - [-1, 2, C3k2_LK, [512, True, 0.5, False, 7]]             # 6 P4/16 K=7
  - [-1, 1, SPPF, [512, 5, 3, True]]                          # 7
  - [-1, 2, C2PSA, [512]]                                     # 8

head:
  - [8, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 2, C3k2, [128, True]]

  - [-1, 1, ResoConv, [128, False, True]]                     # 15 P2->P3 (DWT, no shortcut, no HH)
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, True]]

  - [-1, 1, ResoConv, [256, False, True]]                     # 18 P3->P4 (DWT, no shortcut, no HH)
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]

  - [[14, 17, 20], 1, Detect, [nc]]
