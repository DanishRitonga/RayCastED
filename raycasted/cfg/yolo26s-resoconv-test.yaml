# YOLO26s with ResoConv blocks (P2-P4 neck, C2PSA@P4)
# Test config to verify ResoConv implementation
# ResoConv replaces strided Conv — outputs H/2 x W/2

nc: 5
scales:
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.33, 1.25, 512]

backbone:
  - [-1, 1, ResoConv, [64]]           # 0-P1/2  (was Conv [64, 3, 2])
  - [-1, 1, ResoConv, [128]]          # 1-P2/4  (was Conv [128, 3, 2])
  - [-1, 1, C3k2, [256, 2, True]]
  - [-1, 1, ResoConv, [256]]          # 3-P3/8  (was Conv [256, 3, 2])
  - [-1, 1, C3k2, [256, 1, True]]
  - [-1, 1, ResoConv, [256]]          # 5-P4/16 (was Conv [256, 3, 2])
  - [-1, 1, SPPF, [256, 5]]
  - [-1, 1, C2PSA, [256, 1]]

head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, 1, True]]

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 2], 1, Concat, [1]]
  - [-1, 1, C3k2, [64, 1, True]]

  - [-1, 1, ResoConv, [64]]           # P2->P3 (was Conv [64, 3, 2])
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 1, C3k2, [128, 1, True]]

  - [-1, 1, ResoConv, [128]]          # P3->P4 (was Conv [128, 3, 2])
  - [[-1, 8], 1, Concat, [1]]
  - [-1, 1, C3k2, [256, 1, True]]

  - [[14, 17, 20], 1, RayCastDetect, [5, 1, True, [64, 128, 256]]]
