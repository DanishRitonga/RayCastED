# YOLO26s with ResoConv blocks (P2-P4 neck, C2PSA@P4, dummy P5)
# Test config to verify ResoConv implementation

nc: 5
scales: # model compound scaling constants, i.e. 'model=yolov8n.yaml' will call yolov8.yaml with scale='n'
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.33, 1.25, 512]

# YOLOv8.0s backbone with ResoConv
backbone:
  - [-1, 1, Conv, [64, 3, 2]]  # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]  # 1-P2/4
  - [-1, 1, ResoConv, [128]]   # 2-P2/4 (ResoConv test)
  - [-1, 1, Conv, [128, 3, 2]]  # 3-P3/8
  - [-1, 1, C3k2, [256, 2, True]]
  - [-1, 1, Conv, [256, 3, 2]]  # 5-P4/16
  - [-1, 1, C3k2, [256, 1, True]]
  - [-1, 1, SPPF, [256, 5]]     # 7
  - [-1, 1, C2PSA, [256, 1]]    # 8 (C2PSA at P4)

# YOLOv8.0n head (P2-only for testing)
head:
  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 4], 1, Concat, [1]]   # 10 cat P3 (layer 4 is 32x32)
  - [-1, 1, C3k2, [128, 1, True]]  # 11

  - [-1, 1, nn.Upsample, [None, 2, 'nearest']]
  - [[-1, 2], 1, Concat, [1]]   # 13 cat P2 (layer 2 is 64x64)
  - [-1, 1, C3k2, [64, 1, True]]   # 14

  - [-1, 1, Conv, [64, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]  # 16 cat P3
  - [-1, 1, C3k2, [128, 1, True]]  # 17

  - [-1, 1, Conv, [128, 3, 2]]
  - [[-1, 8], 1, Concat, [1]]  # 19 cat P4
  - [-1, 1, C3k2, [256, 1, True]]  # 20

  - [[14, 17, 20], 1, RayCastDetect, [5, 1, True, [64, 128, 256]]]  # 21(P2, P3, P4)
